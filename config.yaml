# Genius pack (GeniusHQ) defaults, v0.1.0.
# You choose their model: run `geniushq model`.
# `hermes profile update geniushq` keeps your copy of this file unless you add --force-config,
# so safety changes in a new release arrive only if you take them (the changelog says when).

# In Discord GeniusHQ gets only these tools: web search, reading images, asking you a question,
# memory, a to-do list and searching their past chats. No terminal, files, code, browser,
# subagents or scheduled jobs. Add more with `geniushq tools`, and read the README first.
platform_toolsets:
  discord: [web, vision, clarify, memory, todo, session_search, mcp-iduh-genius]

# IDuh Genius MCP (optional). Off until you turn it on: set enabled to true, then run /reload-mcp.
# When on, Discord gets every tool this server offers your account (read and add to your Scatterplot inbox;
# no edit or delete). Read docs/iduh-mcp.md first. The pack needs no account until you switch this on.
mcp_servers:
  iduh-genius:
    url: "https://mcp.iduhgenius.com/mcp"
    enabled: false
    auth: oauth
    oauth:
      client_id: "d30c48e0-0622-4376-89f8-24bea1c30503"
      redirect_port: 27891
    tools:
      prompts: false
      resources: false


agent:
  max_turns: 30                # at most 30 rounds of tool use per message, then they wrap up. Not a spending limit

approvals:
  mode: manual                 # prompt for every command Hermes flags as risky (its own default is smart)
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: true
  deny:                        # refused even if approvals are off. A seatbelt, not a sandbox.
    - "sudo *"
    - "doas *"
    - "pkexec *"
    - "git*push*--force*"
    - "git*push* -f*"
    - "git*push*+*"
    - "*curl*| sh"
    - "*curl*| sh *"
    - "*curl*|sh"
    - "*curl*| bash"
    - "*curl*| bash *"
    - "*curl*|bash"
    - "*wget*| sh"
    - "*wget*| sh *"
    - "*wget*| bash"
    - "*wget*| bash *"
    - "*<(curl*"
    - "*$(curl*"
    - "dd *of=/dev/*disk*"
    - "security dump-keychain*"
    - "*security find-*-password*"
    - "*/.env*"
    - "*.ssh/id_*"

terminal:
  backend: local               # runs on this computer. For a sealed sandbox, use Hermes's Docker backend.
  timeout: 180

memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false        # they save without asking. Their own rules (SOUL.md) have them ask before deleting or spending
  nudge_interval: 0            # no automatic background memory reviews (they would spend money in the background)

unauthorized_dm_behavior: ignore   # strangers who DM them get no reply

group_sessions_per_user: true

discord:
  require_mention: true        # in servers they answer when @mentioned, then keep answering in the thread they open (see auto_thread); add thread_require_mention: true to ask for a mention every time
  auto_thread: true
  reactions: true
  history_backfill: false      # they don't read earlier channel messages unless you turn this on
  allow_mentions:
    everyone: false
    roles: false
    users: true
    replied_user: true
